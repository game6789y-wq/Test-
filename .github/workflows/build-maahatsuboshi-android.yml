name: Build MaaHatsuboshiTA Android APK

on:
  push:
    branches: [android-maahatsuboshi]
    paths:
      - 'maahatsuboshi-android/**'
      - '.github/workflows/build-maahatsuboshi-android.yml'
  pull_request:
    paths:
      - 'maahatsuboshi-android/**'
      - '.github/workflows/build-maahatsuboshi-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maahatsuboshi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maahatsuboshi-android/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit tests
        run: cargo test --locked

  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK directory not found: $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            find "$SDK_ROOT" -maxdepth 3 -type d | head -80
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses

      - name: Install required Android SDK packages
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Build debug APK
        run: gradle -p maahatsuboshi-android --no-daemon --stacktrace assembleDebug

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="maahatsuboshi-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee maahatsuboshi-android/apk-sha256.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MaaHatsuboshiTA-Android-debug
          path: |
            maahatsuboshi-android/app/build/outputs/apk/debug/app-debug.apk
            maahatsuboshi-android/apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
