name: Build MaaHatsuboshiTA Android APK
on:
  push:
    branches: [android-maahatsuboshi]
    paths:
      - 'maahatsuboshi-android/**'
      - '.github/workflows/build-maahatsuboshi-android.yml'
  pull_request:
    paths:
      - 'maahatsuboshi-android/**'
      - '.github/workflows/build-maahatsuboshi-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maahatsuboshi-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maahatsuboshi-android/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust unit tests
        run: cargo test --locked

  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses || true
      - name: Install Android SDK components
        run: "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - name: Build debug APK
        run: gradle -p maahatsuboshi-android --no-daemon --stacktrace assembleDebug
      - name: Verify APK and checksum
        run: |
          APK="maahatsuboshi-android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" | tee maahatsuboshi-android/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MaaHatsuboshiTA-Android-debug
          path: |
            maahatsuboshi-android/app/build/outputs/apk/debug/app-debug.apk
            maahatsuboshi-android/apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
